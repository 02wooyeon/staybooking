<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>스테이북 | 숙소 예약</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

 <main class="home-page">

  <!-- 메인 소개 영역 -->
  <section class="home-hero">
    <h1 id="greeting">어디로 떠나볼까요?</h1>
    <p>원하는 지역과 일정을 입력해 숙소를 찾아보세요.</p>

    <!-- 메인 숙소 검색 -->
    <form id="home-search-form" class="home-search-box">

      <div class="home-search-field home-search-keyword">
        <label for="home-keyword">지역 / 숙소명</label>
        <input
          id="home-keyword"
          name="keyword"
          type="text"
          maxlength="100"
          placeholder="예: 서울, 강남">
      </div>

      <div class="home-search-field">
        <label for="home-check-in">체크인</label>
        <input
          id="home-check-in"
          name="checkIn"
          type="date">
      </div>

      <div class="home-search-field">
        <label for="home-check-out">체크아웃</label>
        <input
          id="home-check-out"
          name="checkOut"
          type="date">
      </div>

      <div class="home-search-field">
        <label for="home-guests">인원</label>
        <input
          id="home-guests"
          name="guests"
          type="number"
          min="1"
          max="20"
          value="1">
      </div>

      <button
        class="home-search-button"
        type="submit">
        검색
      </button>

    </form>

    <div
      id="home-search-alert"
      class="alert alert-error"
      role="alert"
      hidden>
    </div>
  </section>


  <!-- 전체 숙소 중 일부 미리보기 -->
  <section class="home-accommodations">

    <div class="home-section-header">
      <div>
        <h2>지금 둘러볼 숙소</h2>
        <p>등록된 숙소를 확인해 보세요.</p>
      </div>

      <a href="/accommodation/list.html">
        전체 숙소 보기
      </a>
    </div>

    <div
      id="home-accommodation-list"
      class="home-accommodation-list">
    </div>

  </section>

</main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
