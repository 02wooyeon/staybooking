<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>내 예약 | 스테이북</title>

  <link
    rel="stylesheet"
    href="/assets/css/style.css">

  <style>
    /* ========================================
       내 예약 목록
       ======================================== */

    .my-booking-page {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 42px 0 80px;
    }

    .my-booking-title {
      margin-bottom: 30px;
    }

    .my-booking-title h1 {
      margin: 0 0 7px;
      font-size: 30px;
    }

    .my-booking-title p {
      margin: 0;
      color: var(--text-sub);
    }

    .my-booking-history-link {
      display: inline-block;
      margin-top: 12px;
      font-weight: 700;
    }

    .my-booking-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .my-booking-tab {
      padding: 9px 17px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .my-booking-tab.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .my-booking-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .my-booking-card {
      display: grid;
      grid-template-columns: 210px 1fr 180px;
      overflow: hidden;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .my-booking-image {
      min-height: 190px;
    }

    .my-booking-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .my-booking-info {
      padding: 24px;
    }

    .my-booking-status {
      display: inline-block;

      margin-bottom: 9px;

      padding: 5px 10px;

      border-radius: 999px;

      font-size: 13px;
      font-weight: 800;
    }

    .my-booking-status.pending {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .my-booking-status.accepted {
      background: #ddf4ff;
      color: #0969da;
    }

    .my-booking-status.completed {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .my-booking-status.cancelled {
      background: var(--error-bg);
      color: var(--error);
    }

    .my-booking-info h2 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .my-booking-room-name {
      margin: 0 0 16px;
      color: var(--text-sub);
    }

    .my-booking-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
    }

    .my-booking-detail-grid span {
      display: block;

      margin-bottom: 3px;

      color: var(--text-sub);
      font-size: 13px;
    }

    .my-booking-detail-grid strong {
      font-size: 15px;
    }

    .my-booking-actions {
      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: stretch;

      gap: 10px;

      padding: 22px;

      border-left: 1px solid var(--border);
    }

    .my-booking-price {
      margin-bottom: 8px;
      text-align: right;
    }

    .my-booking-price span {
      display: block;

      color: var(--text-sub);
      font-size: 13px;
    }

    .my-booking-price strong {
      color: var(--brand);
      font-size: 22px;
    }

    .my-booking-detail-button,
    .my-booking-cancel-button {
      width: 100%;
      height: 42px;

      border-radius: 999px;

      font: inherit;
      font-weight: 700;

      cursor: pointer;
    }

    .my-booking-detail-button {
      border: 0;

      background: var(--brand);
      color: #fff;
    }

    .my-booking-detail-button:hover {
      background: var(--brand-dark);
    }

    .my-booking-cancel-button {
      border: 1px solid var(--border);

      background: #fff;
      color: var(--text);
    }

    .my-booking-cancel-button:hover {
      background: var(--bg);
    }

    .my-booking-cancel-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .my-booking-empty {
      padding: 70px 20px;

      text-align: center;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 15px;

      color: var(--text-sub);
    }

    @media (max-width: 800px) {

      .my-booking-card {
        grid-template-columns: 1fr;
      }

      .my-booking-image {
        height: 220px;
      }

      .my-booking-actions {
        border-left: 0;
        border-top: 1px solid var(--border);
      }

      .my-booking-price {
        text-align: left;
      }

    }

    @media (max-width: 520px) {

      .my-booking-page {
        width: calc(100% - 24px);
      }

      .my-booking-detail-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>


<body>

<header class="site-header">

  <a
    class="logo"
    href="/">
    스테이북
  </a>

  <nav
    id="header-nav"
    class="header-nav">
  </nav>

</header>


<main class="my-booking-page">

  <section class="my-booking-title">

    <h1>
      내 예약 정보
    </h1>

    <p>
      내가 예약한 숙소와 예약 상태를 확인할 수 있습니다.
    </p>

    <a class="my-booking-history-link" href="/payment/history.html">내 결제 내역 보기 →</a>

  </section>


  <div
    id="my-booking-alert"
    class="alert alert-error"
    hidden>
  </div>


  <!-- 예약 상태 필터 -->
  <div class="my-booking-tabs">

    <button
      class="my-booking-tab active"
      type="button"
      data-status="ALL">

      전체

    </button>

    <button
      class="my-booking-tab"
      type="button"
      data-status="PENDING">

      예약 진행

    </button>

    <button
      class="my-booking-tab"
      type="button"
      data-status="COMPLETED">

      예약 완료

    </button>

    <button
      class="my-booking-tab"
      type="button"
      data-status="CANCELLED">

      취소

    </button>

  </div>


  <section
    id="my-booking-list"
    class="my-booking-list">
  </section>

</main>


<script src="/assets/js/api.js"></script>
<script src="/assets/js/common.js"></script>


<script src="/assets/js/booking-my.js"></script>

</body>
</html>
