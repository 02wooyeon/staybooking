spring.application.name=staybooking

# 별도 DB 환경변수가 없을 때는 팀원이 즉시 화면과 API를 확인할 수 있도록 로컬 H2를 사용한다.
# DB01 연동 검증은 SPRING_PROFILES_ACTIVE=mysql로 명시적으로 실행한다.
spring.profiles.default=local

# 비워 두면 실행할 때마다 임의 키를 쓴다. 서버를 여러 대 띄우거나 재시작 후에도 토큰을 유지하려면 32바이트 이상으로 설정한다.
staybooking.jwt.secret=${STAYBOOKING_JWT_SECRET:}
staybooking.jwt.access-token-ttl=PT15M
staybooking.jwt.refresh-token-ttl=P14D

# Refresh Token 쿠키에 Secure를 붙인다. HTTPS가 아닌 주소(예: http://WAS-IP:8080)로 직접 테스트할 때만 false로 둔다.
staybooking.auth.cookie-secure=${STAYBOOKING_COOKIE_SECURE:true}

# PG 연동 전 결제 완료 요청은 기본적으로 차단한다. 로컬 프로필에서만 모의 결제를 허용한다.
staybooking.payment.demo-enabled=false

# 주문서형 결제 연동 키. 클라이언트 키만 브라우저에 전달하고 시크릿 키는 서버에서만 사용한다.
staybooking.toss.client-key=${STAYBOOKING_TOSS_CLIENT_KEY:}
staybooking.toss.secret-key=${STAYBOOKING_TOSS_SECRET_KEY:}

# 업로드 이미지 저장 폴더. 웹 루트(static) 밖이어야 하며, 서버에서는 Tomcat 계정만 쓸 수 있는 경로로 지정한다.
staybooking.upload.dir=${STAYBOOKING_UPLOAD_DIR:${java.io.tmpdir}/staybooking-uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
