# Activate with SPRING_PROFILES_ACTIVE=mysql after preparing the database and user.
spring.datasource.url=${STAYBOOKING_DB_URL}
spring.datasource.username=${STAYBOOKING_DB_USER}
spring.datasource.password=${STAYBOOKING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Without Flyway, update creates missing tables during development; use validate after schema review.
spring.jpa.hibernate.ddl-auto=${STAYBOOKING_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
