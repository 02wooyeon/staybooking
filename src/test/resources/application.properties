spring.datasource.generate-unique-name=true
spring.jpa.hibernate.ddl-auto=create-drop
staybooking.jwt.secret=test-only-jwt-secret-key-at-least-32-bytes
# 기존 API 테스트는 호스트 분리와 무관하게 실행하고, 전용 테스트에서 관리자 호스트를 지정한다.
staybooking.admin.host=
staybooking.upload.dir=${java.io.tmpdir}/staybooking-test-uploads
# 모든 테스트가 같은 IP(127.0.0.1)로 요청하므로 IP 잠금이 다른 테스트에 번지지 않게 크게 둔다.
staybooking.auth.max-login-failures-per-ip=1000
