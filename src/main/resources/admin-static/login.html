<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <!-- 관리자 화면은 검색 엔진에 노출하지 않는다 -->
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 로그인 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <span class="logo">스테이북 <span class="admin-logo-tag">관리자</span></span>
  </header>

  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">관리자 로그인</h1>
      <p class="auth-sub">관리자·승인자 계정으로 로그인해 주세요.</p>

      <div id="login-alert" class="alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" maxlength="100"
                 autocomplete="username" required autofocus>
          <p class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-with-button">
            <input id="password" name="password" type="password" maxlength="20"
                   autocomplete="current-password" required>
            <button id="password-toggle" type="button" class="btn-inline"
                    aria-pressed="false" aria-label="비밀번호 보기">보기</button>
          </div>
          <p class="field-error" hidden></p>
        </div>

        <button id="login-submit" class="btn-primary" type="submit">로그인</button>
      </form>

      <p class="admin-login-note">
        이 화면은 운영자 전용입니다. 관리자·승인자 권한이 없는 계정은 로그인할 수 없습니다.
      </p>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script src="/assets/js/admin-login.js"></script>
</body>
</html>
