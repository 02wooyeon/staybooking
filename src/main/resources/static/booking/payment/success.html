<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 주소에 paymentKey가 있으므로 다른 사이트로 Referer를 보내지 않는다 -->
  <meta name="referrer" content="no-referrer">
  <title>결제 확인 중 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="success">
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <main class="pay-page">
    <section class="pay-card" aria-labelledby="pay-title" aria-busy="true">
      <div class="pay-spinner" aria-hidden="true"></div>
      <h1 id="pay-title">결제를 확인하고 있어요</h1>
      <p class="pay-sub">잠시만 기다려 주세요. 이 화면을 닫거나 새로고침하지 마세요.</p>

      <ul class="pay-steps" aria-live="polite">
        <li class="done">✓ 결제 인증 완료</li>
        <li id="pay-step-verify" class="now">● 결제 금액·주문번호 확인 중</li>
        <li>○ 예약 확정 처리</li>
      </ul>

      <p class="pay-note">
        서버가 결제대행사에 직접 결제 내역을 조회해 예약 금액과 일치하는지 확인합니다.
        확인이 끝나야 결제가 완료됩니다.
      </p>
      <div class="pay-actions">
        <button id="pay-retry" class="btn-primary" type="button" hidden>승인 결과 다시 확인</button>
        <a class="btn-outline" href="/booking/my.html">내 예약 보기</a>
      </div>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/booking-payment-live.js"></script>
</body>
</html>
