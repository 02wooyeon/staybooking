<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>결제 완료 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="complete">
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <main class="pay-page">
    <section class="pay-card" data-state="loading">
      <div class="pay-spinner" aria-hidden="true"></div>
      <p class="pay-sub">결제 정보를 불러오는 중입니다.</p>
    </section>

    <section class="pay-card" data-state="ready" aria-labelledby="pay-title" hidden>
      <div class="pay-icon ok" aria-hidden="true">✓</div>
      <h1 id="pay-title">결제가 완료되었습니다</h1>
      <p class="pay-sub">숙소에서 예약을 확인하면 확정 안내를 드립니다.</p>

      <dl id="pay-summary" class="pay-summary"></dl>

      <div class="pay-actions">
        <a class="btn-outline" href="/">홈으로</a>
        <a class="btn-primary" href="/booking/my.html">내 예약 보기</a>
      </div>
    </section>

    <section class="pay-card" data-state="error" hidden>
      <div class="pay-icon fail" aria-hidden="true">✕</div>
      <h1>결제 정보를 확인할 수 없습니다</h1>
      <p id="pay-error-message" class="pay-sub"></p>
      <div class="pay-actions pay-actions-single">
        <a class="btn-primary" href="/booking/my.html">내 예약 보기</a>
      </div>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/booking-payment-live.js"></script>
</body>
</html>
