<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <!-- 관리자 화면은 검색 엔진에 노출하지 않는다 -->
  <meta name="robots" content="noindex, nofollow">
  <title>Q&amp;A 관리 | 스테이북 관리자</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/index.html">스테이북 <span class="admin-logo-tag">관리자</span></a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <p id="admin-loading" class="admin-loading" role="status">권한을 확인하는 중입니다...</p>

  <main id="admin-denied" class="admin-denied" hidden>
    <section class="pay-card">
      <div class="pay-icon fail" aria-hidden="true">✕</div>
      <h1>접근 권한이 없습니다</h1>
      <p id="admin-denied-message" class="pay-sub"></p>
      <div class="pay-actions">
        <button id="admin-relogin" class="btn-primary" type="button">다른 계정으로 로그인</button>
      </div>
    </section>
  </main>

  <div id="admin-content" class="admin-layout" hidden>
    <aside class="admin-side">
      <p class="admin-side-title">관리자</p>
      <p class="admin-side-user">
        <strong id="admin-user-name"></strong>
        <span id="admin-user-role" class="admin-badge muted"></span>
      </p>
      <nav aria-label="관리자 메뉴">
        <ul id="admin-nav" class="admin-nav"></ul>
      </nav>
    </aside>

    <main class="admin-main">
      <h1>Q&amp;A 관리</h1>
      <p class="page-sub">고객 문의에 답변하고, 부적절한 글은 사유를 남겨 숨깁니다. 비밀글도 관리자는 내용을 볼 수 있습니다.</p>

      <div id="page-alert" class="alert" role="alert" hidden></div>

      <form id="filter-form" class="admin-filters" role="search" aria-label="문의 검색">
        <label>검색어
          <input name="q" type="search" maxlength="200" placeholder="제목·내용">
        </label>
        <label>답변
          <select name="answered" class="form-select">
            <option value="">전체</option>
            <option value="false">답변 대기</option>
            <option value="true">답변 완료</option>
          </select>
        </label>
        <label>숨김
          <select name="deleted" class="form-select">
            <option value="false">공개 중</option>
            <option value="true">숨김 처리됨</option>
            <option value="">전체</option>
          </select>
        </label>
        <label>작성자 ID
          <input name="userId" type="number" min="1" step="1" inputmode="numeric" placeholder="회원 ID">
        </label>
        <div class="admin-filter-buttons">
          <button class="btn-primary" type="submit">검색</button>
          <button class="btn-outline" type="reset">초기화</button>
        </div>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <caption class="sr-only">문의 목록</caption>
          <thead>
            <tr>
              <th scope="col">문의 ID</th>
              <th scope="col">유형</th>
              <th scope="col">제목</th>
              <th scope="col">작성자 ID</th>
              <th scope="col">작성일</th>
              <th scope="col">상태</th>
              <th scope="col">관리</th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
      <div id="pagination"></div>

      <section id="qna-detail" class="info-card admin-detail" aria-labelledby="qna-detail-title" hidden>
        <div class="admin-toolbar">
          <div>
            <h2 id="qna-detail-title"></h2>
            <p id="qna-detail-meta" class="card-sub"></p>
          </div>
          <button id="qna-detail-close" class="btn-link" type="button">닫기</button>
        </div>
        <div id="qna-detail-badges" class="admin-badges"></div>
        <p id="qna-detail-content" class="admin-pre"></p>
        <p id="qna-detail-hidden" class="admin-hidden-note" hidden></p>

        <form id="answer-form" class="admin-subform" novalidate>
          <h3>관리자 답변</h3>
          <div class="field">
            <label for="answer-content" class="sr-only">답변 내용</label>
            <textarea id="answer-content" name="content" class="form-textarea" rows="5" maxlength="2000" required
                      placeholder="답변 내용을 입력해 주세요." aria-describedby="answer-count"></textarea>
            <p id="answer-count" class="char-count">0 / 2000</p>
          </div>
          <div class="admin-form-actions">
            <button id="qna-hide" class="btn-outline admin-danger-outline" type="button">글 숨기기</button>
            <button id="answer-submit" class="btn-primary" type="submit">답변 등록</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script src="/assets/js/admin-qna.js"></script>
</body>
</html>
