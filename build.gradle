plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kisia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// 환경변수 없이 로컬 화면·API를 구동할 때 사용하는 개발용 DB다.
	runtimeOnly 'com.h2database:h2:2.3.232'

	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// H2 2.4.240의 enum CHECK 제약 오류를 피하기 위해 로컬 개발·테스트 버전을 고정한다.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 기존 DB, JWT 등 프로젝트 의존성은 이곳에 유지
}

tasks.named('test') {
	useJUnitPlatform()
}

// 관리자 도메인의 admin-static 화면도 일반 화면과 같은 인증 모듈·스타일을 사용한다.
// 소스는 static에 하나만 두고 빌드 결과에만 관리자용 사본을 포함한다.
tasks.named('processResources', ProcessResources) {
	from('src/main/resources/static') {
		include 'assets/js/api.js'
		include 'assets/css/style.css'
		into 'admin-static'
	}
}

tasks.named('bootWar') {
	archiveFileName = 'staybooking.war'
}

tasks.named('war') {
	enabled = false
}
