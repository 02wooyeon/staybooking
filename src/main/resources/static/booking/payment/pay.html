<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>결제 대기 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="pending">
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <main class="pay-page">
    <section class="pay-card" data-state="loading">
      <div class="pay-spinner" aria-hidden="true"></div>
      <p class="pay-sub">예약 정보를 불러오는 중입니다.</p>
    </section>

    <section class="pay-card" data-state="ready" aria-labelledby="pay-title" hidden>
      <div class="pay-icon wait" aria-hidden="true">!</div>
      <h1 id="pay-title">결제를 기다리고 있어요</h1>
      <p class="pay-sub">아래 시간 안에 결제하지 않으면 예약이 자동 취소됩니다.</p>
      <p id="pay-timer" class="pay-timer" role="timer" aria-live="off">남은 시간 --:--</p>

      <dl id="pay-summary" class="pay-summary"></dl>

      <div id="payment-method"></div>
      <div id="payment-agreement"></div>

      <div id="pay-cancel-confirm" class="pay-confirm" role="alertdialog" aria-labelledby="pay-cancel-text" hidden>
        <p id="pay-cancel-text">예약을 취소할까요? 취소한 예약은 되돌릴 수 없습니다.</p>
        <div class="pay-actions">
          <button id="pay-cancel-no" class="btn-outline" type="button">계속 결제하기</button>
          <button id="pay-cancel-yes" class="btn-primary" type="button">예약 취소</button>
        </div>
      </div>

      <div class="pay-actions">
        <button id="pay-cancel-button" class="btn-outline" type="button" hidden>예약 취소</button>
        <button id="pay-button" class="btn-primary" type="button" disabled>결제하기</button>
      </div>

      <button id="pay-fail-demo" class="btn-link pay-demo-link" type="button" hidden>(화면 시연) 결제 실패로 이동</button>
    </section>

    <section class="pay-card" data-state="error" hidden>
      <div class="pay-icon fail" aria-hidden="true">✕</div>
      <h1>결제를 진행할 수 없습니다</h1>
      <p id="pay-error-message" class="pay-sub"></p>
      <div class="pay-actions pay-actions-single">
        <a class="btn-primary" href="/booking/my.html">내 예약 보기</a>
      </div>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="/assets/js/booking-payment-live.js"></script>
</body>
</html>
