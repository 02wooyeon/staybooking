# 로컬 개발 전용 인메모리 DB. 애플리케이션을 종료하면 이 데이터는 사라진다.
# DB_CLOSE_DELAY=-1: 커넥션 풀이 연결을 모두 교체하는 순간(기본 30분)에도 DB가 지워지지 않게 한다.
spring.datasource.url=jdbc:h2:mem:staybooking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 테이블을 만든 뒤 샘플 숙소·객실·테스트 계정을 넣어 화면을 바로 확인할 수 있게 한다. (계정은 파일 맨 위 참고)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:local-sample-data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# localhost HTTP 테스트에서는 Secure 쿠키를 브라우저가 저장하지 않으므로 로컬에서만 해제한다.
staybooking.auth.cookie-secure=false

# 개발 환경에서만 예약 흐름을 확인하는 모의 결제. 실제 금전 거래는 발생하지 않는다.
staybooking.payment.demo-enabled=true
