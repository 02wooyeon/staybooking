<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 결제 내역 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .payment-history-page { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 80px; }
    .payment-history-page h1 { margin: 0 0 8px; }
    .payment-history-lead { margin: 0 0 24px; color: var(--text-sub); }
    .payment-history-list { display: grid; gap: 16px; }
    .payment-history-card { padding: 24px; border: 1px solid var(--border); border-radius: 15px; background: var(--card); }
    .payment-history-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .payment-history-heading h2 { margin: 0; font-size: 20px; }
    .payment-history-status { font-weight: 700; color: var(--brand); }
    .payment-history-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin: 0; }
    .payment-history-details div { min-width: 0; }
    .payment-history-details dt { margin-bottom: 4px; color: var(--text-sub); font-size: 13px; }
    .payment-history-details dd { margin: 0; overflow-wrap: anywhere; font-weight: 600; }
    .payment-history-empty { padding: 48px 20px; border: 1px solid var(--border); border-radius: 15px; background: var(--card); text-align: center; color: var(--text-sub); }
    .payment-history-more { width: 100%; margin-top: 18px; }
    @media (max-width: 600px) { .payment-history-details { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>
  <main class="payment-history-page">
    <p class="breadcrumb"><a href="/booking/my.html">← 내 예약</a></p>
    <h1>내 결제 내역</h1>
    <p class="payment-history-lead">예약번호와 결제 주문번호, 결제·환불 상태를 확인할 수 있습니다.</p>
    <div id="payment-history-alert" class="alert alert-error" role="alert" hidden></div>
    <div id="payment-history-list" class="payment-history-list" aria-live="polite"></div>
    <p id="payment-history-empty" class="payment-history-empty" hidden>결제 내역이 없습니다.</p>
    <button id="payment-history-more" class="btn-outline payment-history-more" type="button" hidden>더 보기</button>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/payment-history.js"></script>
</body>
</html>
