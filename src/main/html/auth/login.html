<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>로그인 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
  </header>

  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">로그인</h1>
      <p class="auth-sub">가입한 이메일과 비밀번호를 입력해 주세요.</p>

      <div id="login-alert" class="alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" maxlength="100"
                 autocomplete="username" placeholder="example@email.com" required autofocus>
          <p class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-with-button">
            <input id="password" name="password" type="password" maxlength="20"
                   autocomplete="current-password" placeholder="비밀번호" required>
            <button type="button" class="btn-inline" data-toggle-password="password"
                    aria-pressed="false" aria-label="비밀번호 보기">보기</button>
          </div>
          <p class="field-error" hidden></p>
        </div>

        <button id="login-submit" class="btn-primary" type="submit">로그인</button>
      </form>

      <div class="auth-links">
        <span class="muted">아이디 찾기 (준비 중)</span>
        <span aria-hidden="true">·</span>
        <a href="/signup.html">회원가입</a>
      </div>

      <div class="divider"><span>또는</span></div>
      <button type="button" class="btn-social" disabled title="소셜 로그인은 준비 중입니다">소셜 계정으로 로그인 (준비 중)</button>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/login.js"></script>
</body>
</html>
