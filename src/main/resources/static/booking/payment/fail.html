<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>결제 실패 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="fail">
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <main class="pay-page">
    <section class="pay-card" aria-labelledby="pay-title">
      <div class="pay-icon fail" aria-hidden="true">✕</div>
      <h1 id="pay-title">결제에 실패했습니다</h1>
      <p id="pay-fail-sub" class="pay-sub">결제 금액은 청구되지 않았습니다.</p>

      <div class="pay-error-box" role="alert">
        <p id="pay-fail-message"></p>
        <code id="pay-fail-code"></code>
      </div>

      <dl id="pay-summary" class="pay-summary"></dl>

      <div class="pay-actions">
        <a class="btn-outline" href="/booking/my.html">내 예약 보기</a>
        <a id="pay-retry-link" class="btn-primary" href="/booking/my.html" hidden>다시 결제하기</a>
      </div>

      <p class="pay-note">결제창을 직접 닫은 경우에도 이 화면이 표시되며, 결제 기한 안에는 다시 결제할 수 있습니다.</p>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/booking-payment-live.js"></script>
</body>
</html>
