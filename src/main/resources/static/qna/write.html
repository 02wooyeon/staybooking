<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>1:1 문의 작성 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <main class="info-page">
    <p class="breadcrumb"><a href="/qna.html">고객센터</a> <span aria-hidden="true">›</span> 1:1 문의 작성</p>
    <h1>1:1 문의 작성</h1>
    <p class="page-sub">답변은 고객센터의 최근 내 문의에서 확인할 수 있습니다.</p>

    <form id="inquiry-form" class="info-card" novalidate>
      <div id="inquiry-alert" class="alert" role="alert" hidden></div>

      <div class="field">
        <label for="inquiry-category">문의 유형 <span class="req" aria-hidden="true">*</span></label>
        <select id="inquiry-category" name="category" class="form-select" required>
          <option value="">유형을 선택해 주세요</option>
          <option value="booking">예약</option>
          <option value="payment">결제</option>
          <option value="refund">취소·환불</option>
          <option value="account">회원</option>
          <option value="etc">기타</option>
        </select>
        <p class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="inquiry-booking">관련 예약 <span class="optional">(선택)</span></label>
        <select id="inquiry-booking" name="bookingId" class="form-select">
          <option value="">선택 안 함</option>
        </select>
        <p class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="inquiry-title">제목 <span class="req" aria-hidden="true">*</span></label>
        <input id="inquiry-title" name="title" type="text" maxlength="100"
               placeholder="제목을 입력해 주세요" required>
        <p class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="inquiry-content">내용 <span class="req" aria-hidden="true">*</span></label>
        <textarea id="inquiry-content" name="content" class="form-textarea" maxlength="2000" rows="8"
                  placeholder="문의 내용을 자세히 입력해 주세요. (10자 이상)" aria-describedby="inquiry-count" required></textarea>
        <p id="inquiry-count" class="char-count">0 / 2000</p>
        <p class="field-error" hidden></p>
      </div>

      <p class="card-sub">이미지 첨부는 준비 중입니다. 현재는 텍스트 문의만 등록할 수 있습니다.</p>

      <label class="check secret-check">
        <input id="inquiry-secret" name="secret" type="checkbox" checked>
        <span>비밀글로 작성 <small>(작성자와 관리자만 볼 수 있습니다)</small></span>
      </label>

      <div class="form-actions">
        <a class="btn-outline" href="/qna.html">취소</a>
        <button id="inquiry-submit" class="btn-primary" type="submit">문의 등록</button>
      </div>
    </form>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/qna-write.js"></script>
</body>
</html>
