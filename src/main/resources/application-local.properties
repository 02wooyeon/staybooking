# 로컬 개발 전용 인메모리 DB. 애플리케이션을 종료하면 이 데이터는 사라진다.
spring.datasource.url=jdbc:h2:mem:staybooking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# localhost HTTP 테스트에서는 Secure 쿠키를 브라우저가 저장하지 않으므로 로컬에서만 해제한다.
staybooking.auth.cookie-secure=false

# 개발 환경에서만 예약 흐름을 확인하는 모의 결제. 실제 금전 거래는 발생하지 않는다.
staybooking.payment.demo-enabled=true

# 일반 사이트 localhost와 관리자 사이트 admin.localhost를 같은 WAS에서 분리한다.
staybooking.admin.host=admin.localhost
